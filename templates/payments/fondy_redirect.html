<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to Fondy...</title>
  </head>
  <body>
    <p>Перенаправляем на оплату...</p>
    <form id="fondy-form" method="post" action="{{ fondy_url }}">
      {% csrf_token %}
      {% for key, value in data.items %}
        <input type="hidden" name="{{ key }}" value="{{ value }}" />
      {% endfor %}
    </form>
    <script>document.getElementById('fondy-form').submit();</script>
  </body>
</html>
